services:
  job-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./index.html:/app/index.html
      - ./server.js:/app/server.js
      - ./ai-service.js:/app/ai-service.js
      - ./cv-parser.js:/app/cv-parser.js
      - ./scrapers:/app/scrapers
      - ./package.json:/app/package.json
      - ./.env:/app/.env
      - ./PROMPT.md:/app/PROMPT.md
    restart: unless-stopped
    networks:
      - job-tracker-network

networks:
  job-tracker-network:
    driver: bridge
